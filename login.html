<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMIS - সাইন ইন / লগইন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fingerprint-pulse {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <div class="bg-slate-900 text-white p-6 text-center relative">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-600 text-white mb-3 shadow-lg">
                <i class="fa-solid me-0 fa-shield-halved text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-wide">PMIS সিস্টেম লগইন</h2>
            <p class="text-slate-400 text-xs mt-1">Prison Management Information System</p>
        </div>

        <div class="px-6 pt-5">
            <label class="block text-xs font-semibold text-slate-600 mb-1">লগইন রোল (Role) নির্বাচন করুন</label>
            <select id="userRole" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="officer">জেল অফিসার (Jail Officer)</option>
                <option value="operator">ডাটা এন্ট্রি অপারেটর (Data Entry Operator)</option>
                <option value="supervisor">সুপারভাইজার (Supervisor)</option>
                <option value="admin">সিস্টেম অ্যাডমিন (System Admin)</option>
            </select>
        </div>

        <div class="flex border-b border-slate-200 mt-4 px-6">
            <button id="tabPassword" onclick="switchTab('password')" class="flex-1 py-2 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 focus:outline-none transition">
                <i class="fa-solid fa-key mr-1"></i> পাসওয়ার্ড
            </button>
            <button id="tabBiometric" onclick="switchTab('biometric')" class="flex-1 py-2 text-sm font-semibold text-slate-500 hover:text-blue-600 focus:outline-none transition">
                <i class="fa-solid fa-fingerprint mr-1"></i> ফিঙ্গারপ্রিন্ট
            </button>
        </div>

        <div class="p-6">
            
            <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs font-medium"></div>

            <form id="formPasswordLogin" onsubmit="handlePasswordLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ইউজারনেম / ইউজারের আইডি</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="username" required placeholder="উদাহরণ: user_101" 
                               class="w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">পাসওয়ার্ড</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••" 
                               class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                            <i id="eyeIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center text-slate-600 cursor-pointer">
                        <input type="checkbox" class="rounded text-blue-600 focus:ring-blue-500 mr-2"> আমাকে মনে রাখুন
                    </label>
                    <a href="#" onclick="alert('পাসওয়ার্ড রিসেট করতে সিস্টেমে অ্যাডমিনের সাথে যোগাযোগ করুন।')" class="text-blue-600 hover:underline">পাসওয়ার্ড ভুলে গেছেন?</a>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg shadow-md transition duration-200 flex items-center justify-center">
                    <span>লগইন করুন</span>
                    <i class="fa-solid fa-arrow-right ml-2 text-xs"></i>
                </button>
            </form>

            <div id="formBiometricLogin" class="hidden flex-col items-center justify-center py-4 space-y-4 text-center">
                <p class="text-xs text-slate-600">ডিভাইসের সাথে সংযুক্ত বায়োমেট্রিক সেন্সরে আপনার নিবন্ধিত আঙুল স্পর্শ করুন</p>
                
                <div id="scannerCircle" onclick="startFingerprintScan()" class="cursor-pointer relative w-24 h-24 rounded-full bg-slate-100 border-2 border-blue-500 flex items-center justify-center text-blue-600 transition hover:scale-105">
                    <i id="fingerIcon" class="fa-solid fa-fingerprint text-5xl"></i>
                </div>

                <div id="scanStatus" class="text-xs font-semibold text-slate-500">
                    স্ক্যান করতে সেন্সরে ক্লিক করুন বা আঙুল দিন
                </div>

                <button type="button" onclick="startFingerprintScan()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 rounded-lg shadow-md transition duration-200">
                    <i class="fa-solid fa-fingerprint mr-2"></i> বায়োমেট্রিক যাচাই করুন
                </button>
            </div>

        </div>

        <div class="bg-slate-50 border-t border-slate-200 p-3 text-center text-[11px] text-slate-500">
            &copy; 2026 PMIS Bangladesh. অননুমোদিত প্রবেশ শাস্তিযোগ্য অপরাধ।
        </div>

    </div>

    <script>
        // Switch between Password Login & Biometric Login
        function switchTab(type) {
            const passForm = document.getElementById('formPasswordLogin');
            const bioForm = document.getElementById('formBiometricLogin');
            const tabPass = document.getElementById('tabPassword');
            const tabBio = document.getElementById('tabBiometric');

            if (type === 'password') {
                passForm.classList.remove('hidden');
                bioForm.classList.add('hidden');
                tabPass.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
                tabPass.classList.remove('text-slate-500');
                tabBio.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                tabBio.classList.add('text-slate-500');
            } else {
                passForm.classList.add('hidden');
                bioForm.classList.remove('hidden');
                bioForm.classList.add('flex');
                tabBio.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
                tabBio.classList.remove('text-slate-500');
                tabPass.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                tabPass.classList.add('text-slate-500');
            }
        }

        // Password Show/Hide Toggle
        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Show Custom Alert
        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            if (isSuccess) {
                alertBox.classList.add('bg-green-100', 'text-green-700');
            } else {
                alertBox.classList.add('bg-red-100', 'text-red-700');
            }
            alertBox.innerText = msg;
        }

        // Handle Password Login Simulation
        function handlePasswordLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const role = document.getElementById('userRole').value;

            showAlert('লগইন যাচাই করা হচ্ছে...', true);

            setTimeout(() => {
                showAlert(`সফলভাবে লগইন হয়েছে! রিডাইরেক্ট করা হচ্ছে...`, true);
                setTimeout(() => {
                    // রিডাইরেক্ট করুন আপনার মেইন ডাটাবেজ/হোম পেজে
                    window.location.href = 'index.html'; 
                }, 1000);
            }, 1200);
        }

        // Handle Biometric Scan Simulation
        function startFingerprintScan() {
            const circle = document.getElementById('scannerCircle');
            const status = document.getElementById('scanStatus');
            const icon = document.getElementById('fingerIcon');

            circle.classList.add('fingerprint-pulse', 'border-blue-600', 'text-blue-600');
            status.innerText = 'স্ক্যানিং চলছে... সেন্সরে হাত রাখুন';
            status.className = 'text-xs font-semibold text-blue-600';

            // Simulate SDK/Hardware Read
            setTimeout(() => {
                circle.classList.remove('fingerprint-pulse');
                
                // WebAuthn or Scanner Match Success Simulation
                circle.classList.add('bg-green-500', 'text-white', 'border-green-600');
                icon.className = 'fa-solid fa-check text-5xl';
                status.innerText = 'বায়োমেট্রিক সফলভাবে মিলেছে!';
                status.className = 'text-xs font-semibold text-green-600';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            }, 2000);
        }
    </script>
</body>
</html>
